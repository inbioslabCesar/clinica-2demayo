name: Deploy a Hostinger (Test)

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Escribe EXACTAMENTE: DEPLOY_HOSTINGER_TEST'
        required: true
        type: string
      confirm_host:
        description: 'Escribe EXACTAMENTE el host configurado en el secret SSH_HOST'
        required: true
        type: string

concurrency:
  group: deploy-hostinger-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirmacion humana obligatoria
        run: |
          set -euo pipefail
          [[ "${{ github.ref_name }}" == "main" ]] || { echo "Este deploy solo puede ejecutarse desde main"; exit 1; }
          [[ "${{ github.event.inputs.confirm_production }}" == "DEPLOY_HOSTINGER_TEST" ]] || { echo "Confirmacion de despliegue invalida"; exit 1; }
          [[ "${{ github.event.inputs.confirm_host }}" == "${{ secrets.SSH_HOST }}" ]] || { echo "Confirmacion de host invalida"; exit 1; }
          echo "Confirmaciones validas. Continuando deploy..."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build frontend (sistema + landing)
        run: npm run build

      - name: Validar secrets SSH requeridos
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST" ]] || { echo "Falta secret SSH_HOST"; exit 1; }
          [[ -n "$SSH_PORT" ]] || { echo "Falta secret SSH_PORT"; exit 1; }
          [[ -n "$SSH_USER" ]] || { echo "Falta secret SSH_USER"; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "Falta secret SSH_PRIVATE_KEY"; exit 1; }

      - name: Configurar llave SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Instalar utilidades de sincronizacion
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Preflight remoto SSH (validar public_html)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'pwd; ls -la; test -d public_html && ls -la public_html || { echo "No existe public_html en esta cuenta SSH"; exit 1; }'

      - name: Escribir marcadores de version de deploy
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf "commit=%s\ndate=%s\n" "$GIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/deploy_version.txt
          printf "commit=%s\ndate=%s\n" "$GIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-public/deploy_version.txt
          printf "commit=%s\ndate=%s\n" "$GIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy_version_backend.txt

      - name: Publicar backend PHP en public_html/sistema (SSH)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          rsync -az --mkpath \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude ".vscode/" \
            --exclude ".idea/" \
            --exclude "dist/" \
            --exclude "dist-public/" \
            --exclude "public-site/" \
            --exclude "src/" \
            --exclude "tests/" \
            --exclude "docs/" \
            --exclude "tmp/" \
            --exclude "vendor/" \
            --exclude "uploads/" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "config.php" \
            --exclude "config/instance.local.php" \
            --exclude "clinica-config/" \
            --exclude "backup/" \
            --exclude "*.log" \
            --exclude "*.sql" \
            --exclude "*.sql.backup" \
            ./ "$SSH_USER@$SSH_HOST:public_html/sistema/"

          rsync -az --mkpath \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./deploy_version_backend.txt "$SSH_USER@$SSH_HOST:public_html/sistema/deploy_version_backend.txt"

      - name: Publicar build de sistema (dist -> public_html/sistema)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          rsync -az --mkpath \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./dist/ "$SSH_USER@$SSH_HOST:public_html/sistema/"

      - name: Publicar landing (dist-public -> public_html)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          rsync -az --mkpath \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./dist-public/ "$SSH_USER@$SSH_HOST:public_html/"

name: Deploy a Hostinger (Test)
run-name: Deploy to Hostinger - ${{ inputs.target_environment }}

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment de GitHub (ej: prod-cardiovidaiquitos)'
        required: true
        type: choice
        options:
          - prod-cardiovidaiquitos
          - prod-centromedicosanantoniodepadua
          - prod-clinicanutrimedperu
          - prod-deepskyblue-porpoise-463614-hostingersite-com
          - prod-dorcassalud
          - prod-femcarepucallpa
          - prod-maternofetalsanjuan
      confirm_production:
        description: 'Escribe EXACTAMENTE: DEPLOY_HOSTINGER_TEST'
        required: true
        type: string
      confirm_host:
        description: 'Escribe EXACTAMENTE el host configurado en el secret SSH_HOST'
        required: true
        type: string

concurrency:
  group: deploy-hostinger-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirmacion humana obligatoria
        run: |
          set -euo pipefail
          [[ "${{ github.ref_name }}" == "main" ]] || { echo "Este deploy solo puede ejecutarse desde main"; exit 1; }
          [[ "${{ github.event.inputs.confirm_production }}" == "DEPLOY_HOSTINGER_TEST" ]] || { echo "Confirmacion de despliegue invalida"; exit 1; }
          [[ -n "${{ secrets.SSH_HOST }}" ]] || { echo "SSH_HOST no esta disponible. Verifica que exista como Environment secret en '${{ github.event.inputs.target_environment }}'."; exit 1; }
          [[ "${{ github.event.inputs.confirm_host }}" == "${{ secrets.SSH_HOST }}" ]] || { echo "Confirmacion de host invalida"; exit 1; }
          echo "Confirmaciones validas. Continuando deploy..."

      - name: Setup PHP para pruebas de backend
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Validar importe unico y honorarios de paquetes (sin BD)
        run: php scripts/verificar_paquete_importe_unico.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build frontend (sistema + landing)
        run: npm run build

      - name: Validar secrets SSH requeridos
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST" ]] || { echo "Falta secret SSH_HOST"; exit 1; }
          [[ -n "$SSH_PORT" ]] || { echo "Falta secret SSH_PORT"; exit 1; }
          [[ -n "$SSH_USER" ]] || { echo "Falta secret SSH_USER"; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "Falta secret SSH_PRIVATE_KEY"; exit 1; }

      - name: Configurar llave SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Instalar utilidades de sincronizacion
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Preflight remoto SSH (validar public_html)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PUBLIC_HTML: ${{ secrets.REMOTE_PUBLIC_HTML }}
        run: |
          set -euo pipefail
          if [[ -n "${REMOTE_PUBLIC_HTML:-}" ]]; then
            RESOLVED_REMOTE_PUBLIC_HTML="$REMOTE_PUBLIC_HTML"
          else
            RESOLVED_REMOTE_PUBLIC_HTML=$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -euo pipefail
              if [ -d \"domains/$SSH_HOST/public_html\" ]; then
                printf '%s' \"domains/$SSH_HOST/public_html\"
              elif [ -d \"public_html\" ]; then
                printf '%s' \"public_html\"
              else
                exit 1
              fi")
          fi

          if [ -z "$RESOLVED_REMOTE_PUBLIC_HTML" ]; then
            echo "No se pudo resolver la carpeta web remota."
            exit 1
          fi

          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "test -d '$RESOLVED_REMOTE_PUBLIC_HTML'" || { echo "La ruta REMOTE_PUBLIC_HTML no existe en el servidor: $RESOLVED_REMOTE_PUBLIC_HTML"; exit 1; }

          echo "REMOTE_PUBLIC_HTML=$RESOLVED_REMOTE_PUBLIC_HTML" >> "$GITHUB_ENV"
          echo "Ruta web remota detectada: $RESOLVED_REMOTE_PUBLIC_HTML"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "pwd; ls -la; test -d '$RESOLVED_REMOTE_PUBLIC_HTML' && ls -la '$RESOLVED_REMOTE_PUBLIC_HTML' || { echo 'No existe la ruta web remota detectada'; exit 1; }"

      - name: Escribir marcadores de version de deploy
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf "commit=%s\ndate=%s\n" "$GIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/deploy_version.txt
          printf "commit=%s\ndate=%s\n" "$GIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-public/deploy_version.txt
          printf "commit=%s\ndate=%s\n" "$GIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy_version_backend.txt

      - name: Publicar backend PHP en public_html/sistema (SSH)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          [[ -n "${REMOTE_PUBLIC_HTML:-}" ]] || { echo "REMOTE_PUBLIC_HTML no fue resuelto"; exit 1; }
          rsync -az --mkpath \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude ".vscode/" \
            --exclude ".idea/" \
            --exclude "dist/" \
            --exclude "dist-public/" \
            --exclude "deploy/" \
            --exclude "public-site/" \
            --exclude "src/" \
            --exclude "tests/" \
            --exclude "docs/" \
            --exclude "tmp/" \
            --exclude "backups/" \
            --exclude "db/" \
            --exclude "data/" \
            --exclude "sql/" \
            --exclude "scripts/" \
            --exclude "migraciones/" \
            --exclude "vendor/" \
            --exclude "uploads/" \
            --exclude "config/" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude ".gitignore" \
            --exclude "config.php" \
            --exclude "db.php" \
            --exclude "data.php" \
            --exclude "config/instance.local.php" \
            --exclude "clinica-config/" \
            --exclude "backup/" \
            --exclude "README.md" \
            --exclude "LICENSE" \
            --exclude "*.md" \
            --exclude "*.txt" \
            --exclude "*.js" \
            --exclude "*.cjs" \
            --exclude "*.mjs" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "vite.config.js" \
            --exclude "vite.public.config.js" \
            --exclude "tailwind.config.js" \
            --exclude "postcss.config.cjs" \
            --exclude "eslint.config.js" \
            --exclude "*.log" \
            --exclude "*.sql" \
            --exclude "*.sql.backup" \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_PUBLIC_HTML/sistema/"

          rsync -az --mkpath \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./deploy_version_backend.txt "$SSH_USER@$SSH_HOST:$REMOTE_PUBLIC_HTML/sistema/deploy_version_backend.txt"

      - name: Limpiar artefactos no runtime heredados en /sistema
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          [[ -n "${REMOTE_PUBLIC_HTML:-}" ]] || { echo "REMOTE_PUBLIC_HTML no fue resuelto"; exit 1; }
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -euo pipefail
            cd '$REMOTE_PUBLIC_HTML/sistema'
            rm -rf .git .github .vscode .idea docs src tests node_modules public-site deploy backups db data sql scripts migraciones || true
            rm -f .gitignore README.md LICENSE package.json package-lock.json vite.config.js vite.public.config.js tailwind.config.js postcss.config.cjs eslint.config.js || true
            rm -f CAMBIOS_PHP_DETALLADOS.js GUIA_IMPLEMENTACION_ASISTENTE_IA.js TEST_SUITE_VALIDACION.js HOSTINGER_UPLOAD_LIST_2026-08-12.txt || true
          "

      - name: Publicar build de sistema (dist -> public_html/sistema)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          [[ -n "${REMOTE_PUBLIC_HTML:-}" ]] || { echo "REMOTE_PUBLIC_HTML no fue resuelto"; exit 1; }
          rsync -az --mkpath \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./dist/ "$SSH_USER@$SSH_HOST:$REMOTE_PUBLIC_HTML/sistema/"

      - name: Publicar landing (dist-public -> public_html)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          [[ -n "${REMOTE_PUBLIC_HTML:-}" ]] || { echo "REMOTE_PUBLIC_HTML no fue resuelto"; exit 1; }
          rsync -az --mkpath \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            ./dist-public/ "$SSH_USER@$SSH_HOST:$REMOTE_PUBLIC_HTML/"
